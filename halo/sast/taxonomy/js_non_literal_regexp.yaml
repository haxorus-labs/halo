id: js-non-literal-regexp
version: 1
title: Non-literal regular expression (ReDoS / injection risk)
match:
  tool: semgrep
  check_ids:
    - "*detect-non-literal-regexp*"
severity: LOW
cwe: CWE-1333
guards: []
notes: >
  Dynamically built regexes are usually audit findings, not directly
