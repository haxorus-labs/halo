id: secret-jwt
version: 1
title: Hardcoded JWT token
match:
  tool: gitleaks
  check_ids:
    - "jwt"
severity: HIGH
cwe: CWE-798
guards:
  - "EXAMPLE|CHANGEME|xxx+|TODO|fake|dummy|test|sample"
  - "process\\.env\\b"
  - "os\\.environ\\b"
  - "getenv\\("
notes: >
  Test-suite tokens (juice-shop ships many) dominate this rule. Dummy
  markers or env indirection refute the finding; decode the token and check
  expiry/subject before upholding.
mutants: []
evidence: []
