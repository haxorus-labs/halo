id: secret-api-key
version: 1
title: Hardcoded API key or credential
match:
  tool: gitleaks
  check_ids:
    - "generic-api-key"
severity: HIGH
cwe: CWE-798
guards:
  - "EXAMPLE|CHANGEME|xxx+|TODO|your[_-]?key|fake|dummy|test|sample"
  - "process\\.env\\b"
  - "os\\.environ\\b"
  - "getenv\\("
notes: >
  gitleaks fires on high-entropy strings including test fixtures and docs.
  Dummy markers, fixture/example paths, or env indirection refute the
  finding. Confirm the key is live before reporting.
mutants: []
evidence: []
