id: secret-private-key
version: 1
title: Hardcoded private key material
match:
  tool: gitleaks
  check_ids:
    - "private-key"
severity: HIGH
cwe: CWE-798
guards:
  - "EXAMPLE|CHANGEME|xxx+|TODO|fake|dummy|test|sample"
  - "process\\.env\\b"
  - "os\\.environ\\b"
  - "getenv\\("
notes: >
  Test fixtures ship example keys constantly. Dummy markers or env
  indirection refute the finding; real PEM blocks in shipped code uphold it.
mutants: []
evidence: []
