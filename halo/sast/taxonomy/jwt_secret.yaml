id: jwt-secret
version: 1
title: Hardcoded JWT secret or embedded token
match:
  tool: semgrep
  check_ids:
    - "*jwt*"
    - "*generic-secret*"
severity: HIGH
cwe: CWE-798
guards:
  - "process\\.env\\b"
  - "os\\.environ\\b"
  - "getenv\\("
  - "EXAMPLE|CHANGEME|xxx|TODO|your[_-]?secret|fake|dummy|test"
notes: >
  Environment-sourced secrets or obvious placeholder/dummy values refute the
  finding. Real literals in shipped code uphold it.
mutants: []
evidence: []
